<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Enemy One-Pager — Crop Shooter (Cloud Island)</title>
    <style>
        :root {
            --red: #CE2E2E;
            --red-dark: #A4201F;
            --black: #141414;
            --ink: #232323;
            --white: #FFFFFF;
            --paper: #FBFBF9;
            --mint: #9FE3C4;
            --mint-ink: #0E5B3C;
            --pink: #FFC9DA;
            --pink-ink: #8A1F45;
            --yellow: #FFE49A;
            --yellow-ink: #7A5A00;
            --blue: #C6E2FF;
            --blue-ink: #12457A;
            --gray: #EFEFEC;
            --border: #E2E0DA;
            --tier-normal: #4FAE7E;
            --tier-elite: #E08A2C;
            --tier-boss: #CE2E2E;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #1c1c1c;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            padding: 28px 16px 60px;
        }

        .app {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* ---------- Top App Bar ---------- */
        .appbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .logo {
            background: var(--red);
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 10px;
            letter-spacing: 1px;
            border-radius: 3px;
        }

        .brand .sub {
            color: #cfcfcf;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab {
            border: none;
            cursor: pointer;
            padding: 9px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: .2px;
            background: #2c2c2c;
            color: #ddd;
            transition: .15s ease;
        }

        .tab:hover {
            background: #3a3a3a;
        }

        .tab.active {
            background: var(--red);
            color: #fff;
        }

        .tab .tier-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* ---------- Sheet (the one-pager itself) ---------- */
        .sheet {
            background: var(--paper);
            border-radius: 6px;
            padding: 34px 38px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            position: relative;
            overflow: hidden;
        }

        .sheet::before {
            /* corner slash accent, template signature */
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: var(--red);
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            opacity: .06;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .tier-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 14px;
            color: #fff;
            margin-bottom: 10px;
        }

        h1.enemy-name {
            font-size: 40px;
            margin: 0 0 2px;
            font-weight: 900;
            letter-spacing: .5px;
            color: var(--black);
            line-height: 1.02;
        }

        .role {
            color: var(--red);
            font-weight: 800;
            font-style: italic;
            font-size: 16.5px;
            margin: 0 0 4px;
        }

        .gdkeys-tag {
            text-align: right;
            font-size: 10px;
            color: #9a9a9a;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .gdkeys-tag b {
            color: var(--red);
        }

        hr.rule {
            border: none;
            border-top: 2px solid var(--black);
            margin: 14px 0 20px;
        }

        /* ---------- Section label pill ---------- */
        .label {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .label.mint {
            background: var(--mint);
            color: var(--mint-ink);
        }

        .label.pink {
            background: var(--pink);
            color: var(--pink-ink);
        }

        .label.yellow {
            background: var(--yellow);
            color: var(--yellow-ink);
        }

        .label.blue {
            background: var(--blue);
            color: var(--blue-ink);
        }

        .label.dark {
            background: var(--black);
            color: #fff;
        }

        /* ---------- Hero row: image + pitch ---------- */
        .hero-grid {
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 24px;
            margin-bottom: 22px;
        }

        .img-placeholder {
            border: 2.5px dashed #c9c6bc;
            border-radius: 8px;
            background: #F2F1EB;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #9b978a;
            padding: 14px;
        }

        .img-placeholder svg {
            width: 46px;
            height: 46px;
            margin-bottom: 8px;
            opacity: .55;
        }

        .img-placeholder .l1 {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: #7c7869;
        }

        .img-placeholder .l2 {
            font-size: 10.5px;
            margin-top: 4px;
            color: #a29e90;
        }

        .pitch p {
            margin: 0 0 12px;
            font-size: 14.2px;
            line-height: 1.55;
            color: var(--ink);
        }

        .hook {
            background: var(--black);
            color: #fff;
            border-radius: 6px;
            padding: 12px 16px;
            font-style: italic;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .hook::before {
            content: "“";
            color: var(--red);
            font-size: 26px;
            font-weight: 900;
            margin-right: 4px;
            font-style: normal;
        }

        /* ---------- Key abilities ---------- */
        .abilities {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .ability-chip {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 10px 10px 9px;
            font-size: 11.8px;
            line-height: 1.35;
            font-weight: 600;
            color: #333;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
        }

        .ability-chip .num {
            display: inline-block;
            background: var(--red);
            color: #fff;
            font-weight: 900;
            font-size: 10px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            text-align: center;
            line-height: 17px;
            margin-bottom: 6px;
        }

        /* ---------- SHMAR + snapshot row ---------- */
        .mid-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            margin-bottom: 8px;
            align-items: start;
        }

        .snapshot {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .snapshot .row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dotted #ddd;
            font-size: 12.3px;
        }

        .snapshot .row:last-child {
            border-bottom: none;
        }

        .snapshot .row span:first-child {
            color: #777;
            font-weight: 600;
        }

        .snapshot .row span:last-child {
            font-weight: 800;
            color: var(--black);
        }

        .shmar-box {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 12px 10px;
            text-align: center;
        }

        .shmar-title {
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 13px;
            color: var(--black);
            margin-bottom: 2px;
        }

        .shmar-sub {
            font-size: 9.5px;
            color: #999;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }

        .shmar-legend {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
            font-size: 9.5px;
            color: #666;
        }

        .shmar-legend span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .shmar-legend i {
            width: 8px;
            height: 8px;
            background: var(--red);
            display: inline-block;
            border-radius: 2px;
        }

        /* ---------- Divider banner ---------- */
        .section-banner {
            background: var(--black);
            color: #fff;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 13px;
            padding: 9px 16px;
            border-radius: 5px;
            margin: 26px 0 16px;
            text-transform: uppercase;
        }

        .strategy-box {
            background: #fff;
            border: 1.5px solid var(--border);
            border-left: 5px solid var(--red);
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 18px;
            font-size: 13.5px;
            line-height: 1.55;
        }

        .five-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .five-card {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 11px 10px;
            min-height: 118px;
        }

        .five-card .ttl {
            font-size: 10.2px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--red);
            margin-bottom: 6px;
        }

        .five-card .txt {
            font-size: 11.6px;
            line-height: 1.4;
            color: #333;
            font-weight: 600;
        }

        /* ---------- Difficulty ---------- */
        .diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 10px;
        }

        .diff-card {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .diff-card .ttl {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .diff-card.perceived .ttl {
            color: var(--pink-ink);
        }

        .diff-card.real .ttl {
            color: var(--blue-ink);
        }

        .gauge {
            background: #EEECE5;
            border-radius: 6px;
            height: 14px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .gauge-fill {
            height: 100%;
            border-radius: 6px;
        }

        .diff-card.perceived .gauge-fill {
            background: linear-gradient(90deg, #FF9EBC, var(--pink-ink));
        }

        .diff-card.real .gauge-fill {
            background: linear-gradient(90deg, #8FC4FF, var(--blue-ink));
        }

        .diff-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #444;
        }

        .flow-tip {
            grid-column: 1/-1;
            background: var(--yellow);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--yellow-ink);
            font-weight: 700;
            margin-bottom: 18px;
        }

        /* ---------- Pillars / reference / concerns ---------- */
        .pillars {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .pillar-tag {
            background: var(--mint);
            color: var(--mint-ink);
            font-weight: 800;
            font-size: 11.5px;
            padding: 7px 13px;
            border-radius: 16px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 8px;
        }

        .ref-list {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .ref-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dotted #e5e5e5;
            font-size: 12px;
            line-height: 1.4;
        }

        .ref-item:last-child {
            border-bottom: none;
        }

        .ref-item .rg {
            font-weight: 900;
            color: var(--black);
            min-width: 118px;
        }

        .ref-item .rx {
            color: #555;
        }

        .concerns {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .concern-row {
            padding: 9px 0;
            border-bottom: 1px dotted #e5e5e5;
            font-size: 12px;
            line-height: 1.42;
        }

        .concern-row:last-child {
            border-bottom: none;
        }

        .concern-row .c-label {
            font-weight: 900;
            color: var(--red-dark);
            display: block;
            margin-bottom: 2px;
        }

        .concern-row .s-label {
            font-weight: 900;
            color: var(--mint-ink);
            display: block;
            margin-top: 4px;
        }

        .footer-note {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #a9a6a0;
            letter-spacing: .5px;
        }

        .footer-note b {
            color: #6d6a63;
        }

        @media (max-width:900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .mid-grid {
                grid-template-columns: 1fr;
            }

            .abilities {
                grid-template-columns: repeat(2, 1fr);
            }

            .five-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .diff-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .appbar {
                display: none;
            }

            .sheet {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <div class="appbar">
            <div class="brand">
                <div class="logo">GD KEYS · ENEMY 1-PAGER</div>
                <div class="sub">Crop Shooter — Cloud Island Enemy Family</div>
            </div>
            <div class="tabs" id="tabs"></div>
        </div>

        <div class="sheet" id="sheet"></div>

    </div>

    <script>
        const TIER_COLOR = { "Normal": "var(--tier-normal)", "Elite": "var(--tier-elite)", "Boss": "var(--tier-boss)" };
        const TIER_DOT = { "Normal": "#4FAE7E", "Elite": "#E08A2C", "Boss": "#CE2E2E" };

        // SHMAR scale: 1=Thấp 2=Trung bình 3=Cao 4=Rất cao 5=Cực cao

        const ENEMIES = [
            {
                id: "rootbiter", tier: "Normal",

                    "Đơn lẻ không đáng sợ — nhưng cả bầy 3-6 con phá đất lao thẳng vào sẽ buộc Player học cách ưu tiên mục tiêu và quản lý đạn.",

                ],

                encouraged: "Chủ động áp sát tiêu diệt nhanh trước khi bị vây",

                perceived: 70, real: 30,

            {

                strategy: "Chờ khiên hạ trong WindUp (0.8s) rồi bắn trực diện, hoặc vòng ra sau lưng (>90°) để bắn liên tục không bị chặn. Frosteratrol Freeze khóa cứng để vòng ra sau thoải mái.",
                skills: "Quan sát cửa sổ tấn công (timing), định vị góc bắn",
                emphasize: "Positioning — di chuyển vòng cung quanh mục tiêu",
                encouraged: "Flanking, kiên nhẫn chờ đúng thời cơ để tối đa sát thương",
                denied: "Xả đạn trực diện liên tục vào khiên vô nghĩa",

        function shmarPolygon(vals) {
            // vals: {S,H,M,A,R} scale 1-5
            const order = ["S", "H", "M", "A", "R"];
            const labels = ["STR", "HP", "MOV", "ATK SPD", "REACH"];
            const cx = 100, cy = 100, maxR = 78;
            const pts = order.map((k, i) => {
                const angle = (-90 + i * 72) * Math.PI / 180;
                const r = (vals[k] / 5) * maxR;
                return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
            });
            const ringPts = (frac) => order.map((k, i) => {
                const angle = (-90 + i * 72) * Math.PI / 180;
                return (cx + frac * maxR * Math.cos(angle)) + "," + (cy + frac * maxR * Math.sin(angle));
            }).join(" ");
            const labelPts = order.map((k, i) => {
                const angle = (-90 + i * 72) * Math.PI / 180;
                const r = maxR + 16;
                return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), t: labels[i], lv: LV[vals[k]] };
            });
            let rings = "";
            [0.25, 0.5, 0.75, 1].forEach(f => {
                rings += `<polygon points="${ringPts(f)}" fill="none" stroke="#E4E1D8" stroke-width="1"/>`;
            });
            let axes = "";
            order.forEach((k, i) => {
                const angle = (-90 + i * 72) * Math.PI / 180;
                axes += `<line x1="${cx}" y1="${cy}" x2="${cx + maxR * Math.cos(angle)}" y2="${cy + maxR * Math.sin(angle)}" stroke="#E4E1D8" stroke-width="1"/>`;
            });
            const polyStr = pts.map(p => p.join(",")).join(" ");
            let labelsSvg = "";
            labelPts.forEach(p => {
                labelsSvg += `<text x="${p.x}" y="${p.y - 3}" text-anchor="middle" font-size="9" font-weight="900" fill="#232323">${p.t}</text>`;
                labelsSvg += `<text x="${p.x}" y="${p.y + 8}" text-anchor="middle" font-size="8" font-weight="700" fill="#CE2E2E">${p.lv}</text>`;
            });
            let dots = "";
            pts.forEach(p => { dots += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#CE2E2E"/>`; });

            return `<svg viewBox="0 0 200 205" width="100%" height="220">
    ${rings}${axes}
    <polygon points="${polyStr}" fill="#CE2E2E" fill-opacity="0.28" stroke="#CE2E2E" stroke-width="2"/>
    ${dots}
    ${labelsSvg}
  </svg>`;
        }

        ${e.stats.map(s => `<div class="row"><span>${s[0]}</span><span>${s[1]}</span></div>`).join("")}
      </div>
      <div class="shmar-box">
        <div class="shmar-title">SHMAR</div>
        <div class="shmar-sub">Strength · Health · Movement · Attack Spd · Reach</div>
        ${shmarPolygon(e.shmar)}
      </div>
    </div>

    <div class="section-banner">⚔ Tương tác với người chơi</div>

    <div class="label mint">Chiến thuật mong đợi từ Player</div>
    <div class="strategy-box">${e.strategy}</div>

    <div class="five-grid">
      <div class="five-card"><div class="ttl">Skills Challenged</div><div class="txt">${e.skills}</div></div>
      <div class="five-card"><div class="ttl">Abilities Emphasized</div><div class="txt">${e.emphasize}</div></div>
      <div class="five-card"><div class="ttl">Encouraged</div><div class="txt">${e.encouraged}</div></div>
      <div class="five-card"><div class="ttl">Denied</div><div class="txt">${e.denied}</div></div>
      <div class="five-card"><div class="ttl">Emotions / Feel</div><div class="txt">${e.emotion}</div></div>
    </div>

    <div class="diff-grid">
      <div class="diff-card perceived">
        <div class="ttl">Độ khó cảm nhận (Perceived)</div>
        <div class="gauge"><div class="gauge-fill" style="width:${e.perceived}%"></div></div>
        <div class="diff-label">${e.perceived}/100</div>
      </div>
      <div class="diff-card real">
        <div class="ttl">Độ khó thực tế (Real)</div>
        <div class="gauge"><div class="gauge-fill" style="width:${e.real}%"></div></div>
        <div class="diff-label">${e.real}/100</div>
      </div>
      <div class="flow-tip">${e.flowTip}</div>
    </div>

    <div class="section-banner">🎯 Bổ sung thiết kế & sản xuất</div>

    <div class="label pink">One-Sentence Hook (X Statement)</div>
    <div class="hook" style="margin-bottom:20px;">${e.hook}</div>

    <div class="label yellow">Trụ cột thiết kế (Design Pillars)</div>
    <div class="pillars">${e.pillars.map(p => `<span class="pillar-tag">${p}</span>`).join("")}</div>

    <div class="two-col">
      <div>
        <div class="label blue">Game tham khảo</div>
        <div class="ref-list">
          ${e.refs.map(r => `<div class="ref-item"><span class="rg">${r[0]}</span><span class="rx">${r[1]}</span></div>`).join("")}
        </div>
      </div>
      <div>
        <div class="label mint">Mối lo ngại & Giải pháp</div>
        <div class="concerns">
          ${e.concerns.map(c => `<div class="concern-row"><span class="c-label">⚠ ${c[0]}</span><span class="s-label">✅ ${c[1]}</span></div>`).join("")}
        </div>
      </div>
    </div>

    <div class="footer-note">
      <span>VitsehLand Studio — Enemy Design Doc v1.0</span>
      <span><b>GD KEYS</b> Enemy One-Pager Tool · Cloud Island Enemy Family (6/6)</span>
    </div>
  `;
        }
        render(0);
    </script>
</body>

</html>
